name: Inspecter le serveur o2switch

# Lecture seule : ce workflow ne dépose, ne modifie et ne supprime rien.
# Il relève le contenu de public_html et le .htaccess qui s'y trouve, puis
# les publie comme artefact téléchargeable — consultable depuis un téléphone,
# sans passer par le gestionnaire de fichiers cPanel.

on:
  workflow_dispatch:

jobs:
  inspecter:
    name: Relever l'état de public_html
    runs-on: ubuntu-latest

    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
      FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}

    steps:
      - name: Vérifier que les trois secrets sont renseignés
        run: |
          set -e
          manquants=""
          [ -n "$FTP_SERVER" ]   || manquants="$manquants FTP_SERVER"
          [ -n "$FTP_USERNAME" ] || manquants="$manquants FTP_USERNAME"
          [ -n "$FTP_PASSWORD" ] || manquants="$manquants FTP_PASSWORD"
          if [ -n "$manquants" ]; then
            echo "Secrets absents ou vides :$manquants"
            exit 1
          fi
          # Le serveur n'est pas une donnée sensible : l'afficher aide au
          # diagnostic et confirme que la valeur est bien injectée.
          echo "Serveur visé : $FTP_SERVER"
          echo "Longueur du mot de passe : ${#FTP_PASSWORD} caractères"

      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Relever le contenu de public_html
        run: |
          set -e
          mkdir -p releve
          # Le document est transmis à lftp sur son entrée standard, sans
          # apostrophes autour du marqueur : le shell y remplace donc bien
          # les variables par leur valeur avant que lftp ne les lise.
          # ssl-force impose le FTPS explicite ; la vérification du certificat
          # est désactivée, les hébergements mutualisés présentant souvent un
          # certificat au nom du serveur et non du domaine. La connexion
          # reste chiffrée.
          lftp <<LFTP
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set cmd:fail-exit true
          set net:max-retries 2
          set net:timeout 20
          open -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_SERVER"
          pwd > releve/repertoire-courant.txt
          cls -l --sort=name > releve/contenu-public_html.txt
          bye
          LFTP
          echo "--- Répertoire atteint ---"
          cat releve/repertoire-courant.txt
          echo "--- Contenu de public_html ---"
          cat releve/contenu-public_html.txt

      - name: Télécharger le .htaccess distant s'il existe
        run: |
          set -e
          lftp <<LFTP || true
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate no
          set net:max-retries 2
          set net:timeout 20
          open -u "$FTP_USERNAME","$FTP_PASSWORD" -p 21 "$FTP_SERVER"
          get .htaccess -o releve/htaccess-distant.txt
          bye
          LFTP
          if [ -s releve/htaccess-distant.txt ]; then
            echo "Un .htaccess est présent sur le serveur. Contenu :"
            echo "------------------------------------------------"
            cat releve/htaccess-distant.txt
            echo "------------------------------------------------"
          else
            echo "Aucun .htaccess sur le serveur : celui du dépôt peut être publié sans risque."
            echo "Aucun .htaccess n'était présent dans public_html." \
              > releve/htaccess-distant.txt
          fi

      - name: Publier le relevé comme artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: releve-public_html
          path: releve/
          retention-days: 7
          if-no-files-found: warn
