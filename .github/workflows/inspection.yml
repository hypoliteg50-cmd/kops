name: Inspecter le serveur o2switch

# Lecture seule : ce workflow ne dépose, ne modifie et ne supprime rien.
# Il récupère le contenu de public_html et le .htaccess qui s'y trouve, puis
# les publie comme artefact téléchargeable — consultable depuis un téléphone,
# sans passer par le gestionnaire de fichiers cPanel.

on:
  workflow_dispatch:

jobs:
  inspecter:
    name: Relever l'état de public_html
    runs-on: ubuntu-latest

    steps:
      - name: Installer lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Relever le contenu du répertoire et le .htaccess
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -e
          mkdir -p releve
          # ssl-force impose le FTPS explicite ; la vérification du certificat
          # est désactivée, les hébergements mutualisés présentant souvent un
          # certificat au nom du serveur et non du domaine. La connexion
          # reste chiffrée.
          lftp -c "
            set ftp:ssl-force true;
            set ftp:ssl-protect-data true;
            set ssl:verify-certificate no;
            set cmd:fail-exit true;
            open -u \"\$FTP_USERNAME\",\"\$FTP_PASSWORD\" -p 21 \"\$FTP_SERVER\";
            pwd > releve/repertoire-courant.txt;
            cls -l --sort=name > releve/contenu-public_html.txt;
          "
          echo "--- Contenu de public_html ---"
          cat releve/contenu-public_html.txt

      - name: Télécharger le .htaccess distant s'il existe
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          if lftp -c "
               set ftp:ssl-force true;
               set ftp:ssl-protect-data true;
               set ssl:verify-certificate no;
               open -u \"\$FTP_USERNAME\",\"\$FTP_PASSWORD\" -p 21 \"\$FTP_SERVER\";
               get .htaccess -o releve/htaccess-distant.txt;
             "; then
            echo "Un .htaccess est présent sur le serveur. Contenu :"
            echo "------------------------------------------------"
            cat releve/htaccess-distant.txt
            echo "------------------------------------------------"
          else
            echo "Aucun .htaccess sur le serveur : celui du dépôt peut être publié sans risque."
            echo "Aucun .htaccess n'était présent dans public_html." \
              > releve/htaccess-distant.txt
          fi

      - name: Publier le relevé comme artefact
        uses: actions/upload-artifact@v4
        with:
          name: releve-public_html
          path: releve/
          retention-days: 7
